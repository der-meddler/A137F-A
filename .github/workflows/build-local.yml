name: Build kernel (local)

# local- tags build on the self-hosted runner in the Droidspaces arch container instead of Namespace:
#   local-build-<anything>  incremental test build, zip uploaded as a workflow artifact
#                           (a tag name containing "clean" forces a full rebuild)
#   any other local- tag    clean build + GitHub release with the zip attached
# Only tag commits that contain this file: older commits run the Namespace workflow instead.
on:
  push:
    tags: ['local-**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    # runner registered inside the container with: config.sh --labels droidspaces
    runs-on: [self-hosted, droidspaces]
    timeout-minutes: 120
    permissions:
      contents: write # publishing the release
    env:
      RELEASE: ${{ !startsWith(github.ref_name, 'local-build-') }}
    steps:
      # the runner service has no sudo, missing packages have to be installed on the host
      - name: Check build dependencies
        run: pacman -T base-devel bc bison flex openssl perl xz gzip zip git

      # a cancelled run can leave git locks in the persistent workspace that checkout doesn't clean
      - name: Remove stale submodule locks
        run: find kernel/.git/modules -name '*.lock' -type f -delete 2>/dev/null || true

      # test builds keep out/ from the previous run so make only rebuilds what changed
      - name: Checkout kernel
        uses: actions/checkout@v7
        with:
          path: kernel
          submodules: recursive
          persist-credentials: false
          clean: ${{ env.RELEASE == 'true' || contains(github.ref_name, 'clean') }}
          # full history: a depth-1 fetch into the existing shallow clone resends the whole
          # 1.3 GB tree every run, with history only the new commits get fetched
          fetch-depth: 0

      # ReSukiSU's version is the KernelSU commit count, a shallow submodule would report a far too old one
      - name: Fetch full KernelSU history
        working-directory: kernel
        run: |
          if [ "$(git -C KernelSU rev-parse --is-shallow-repository)" = true ]; then
            git -C KernelSU fetch --unshallow --force --tags origin
          else
            git -C KernelSU fetch --force --tags origin
          fi
          echo "KernelSU commits: $(git -C KernelSU rev-list --count HEAD)"

      - name: Checkout AnyKernel3
        uses: actions/checkout@v7
        with:
          repository: der-meddler/AK3-osm0sis
          ref: a137f
          path: ak3
          persist-credentials: false

      - name: Build kernel
        working-directory: kernel
        run: bash -e build_kernel.sh

      - name: Pack AnyKernel3 zip
        id: pack
        run: |
          id=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-} # tags may contain / which can't go in file or artifact names
          # point the source line shown while flashing at the exact release tag or commit
          if [ "$RELEASE" = true ]; then
            sed -i "s|^Branch: .*|Tag: $id|" ak3/version
          else
            sed -i "s|^Branch: .*|Commit: ${GITHUB_SHA::8}|" ak3/version
          fi
          # the workspace persists on a self-hosted runner, don't pick up zips from earlier runs
          rm -rf dist && mkdir dist
          ak3/pack.sh kernel/out/arch/arm64/boot/Image.gz "dist/A137F-ReSukiSU-$id.zip"
          echo "zip=dist/A137F-ReSukiSU-$id.zip" >> "$GITHUB_OUTPUT"

      # uploaded as the flashable zip itself (no extra zip around it), download with gh run download
      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.zip }}
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Publish release
        if: env.RELEASE == 'true'
        # pinned to a commit: this job's token can replace release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.pack.outputs.zip }}
          fail_on_unmatched_files: true
          body: |
            Flash with TWRP or the ReSukiSU manager.
            Kernel source: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
