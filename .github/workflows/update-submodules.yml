name: Update submodules

# Replaces the daily "sync the KernelSU fork, git submodule update --remote, add, commit, push"
# chore. Nothing is cloned. First the forks named in sync_forks are brought up to date with their
# upstream through GitHub's merge-upstream API (the "Sync fork" button), but only as a fast-forward:
# a fork branch that has commits of its own is reported and left alone rather than given a merge
# commit every morning. That needs the FORK_SYNC_TOKEN secret, a fine-grained token with Contents:
# write AND Workflows: write on the fork (GitHub refuses to merge upstream commits that touch
# .github/workflows without the latter), because GITHUB_TOKEN cannot write outside this repo;
# without the secret the step only reports, and a failed sync never skips the bump. Then, for
# every branch below, the job reads .gitmodules, looks up the tip of each submodule's tracked
# branch (the one named in .gitmodules, else the submodule repo's default branch) and, where a pin
# is behind, writes a commit through the Git Data API that moves the gitlink and fast-forwards the
# branch. Branches without .gitmodules (main) are skipped. Triggers:
#   dispatch from the container  the systemd timer in .github/runner/ (update-submodules-dispatch.*)
#                                runs `gh workflow run` at 04:23 UTC; that dispatch runs on the
#                                self-hosted runner (input runner=local) and starts within seconds
#   schedule                     04:23 UTC as a fallback on ubuntu-latest for when the container is
#                                down. GitHub fires repo crons hours late (6-7 h seen) and only from
#                                the default branch (main); it finds nothing to do when the timer
#                                already bumped. Copies of this file on other branches are inert
#   Run workflow (dispatch)      any time, with the branch list, a dry-run switch and the runner
#                                choice. The ref picked in the dialog does not matter
# Commits are authored by github-actions[bot] with the usual "update submodule" subject and a body
# naming each submodule and its old..new range. A push made with the workflow token never starts
# other workflows, and builds are tag-triggered anyway, so a bump never builds by itself.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: Branches to bump, separated by spaces
        type: string
        default: resukisu resukisu-nethunter
      sync_forks:
        description: Forks to sync with their upstream first, as owner/repo:branch separated by spaces (empty = none)
        type: string
        default: der-meddler/ReSukiSU-pers-fork:main
      dry_run:
        description: Only report what would be synced and which pins are behind
        type: boolean
        default: false
      runner:
        description: Where to run (local = the self-hosted runner in the Droidspaces container)
        type: choice
        options: [local, github]
        default: local

# one bump at a time; the cron fallback may evict a dispatch left waiting for an offline runner
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  bump:
    # dispatches default to the self-hosted runner, which picks a job up in seconds where GitHub's
    # hosted pool makes it wait; cron runs stay on ubuntu-latest so they work with the container down
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'local'
      && fromJSON('["self-hosted", "droidspaces"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write # creating the bump commits and moving the branches
    steps:
      # runs before the bump so the pin lookup below already sees the fork's new tip. A sync made
      # with the token counts as a push by its owner, so it does start the fork's own push-triggered
      # workflows (unlike GITHUB_TOKEN pushes); disable those in the fork if they are unwanted
      - name: Sync forks with their upstream
        env:
          HAVE_TOKEN: ${{ secrets.FORK_SYNC_TOKEN != '' }}
        uses: actions/github-script@v9
        with:
          # the fallback only matters for dry runs and reports, which need read access alone
          github-token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          script: |
            const inputs = context.payload.inputs ?? {};
            const forks = String(inputs.sync_forks ?? 'der-meddler/ReSukiSU-pers-fork:main').split(/[\s,]+/).filter(Boolean);
            const dryRun = String(inputs.dry_run ?? false) === 'true';
            const haveToken = process.env.HAVE_TOKEN === 'true';
            if (!forks.length) { core.info('sync_forks is empty, nothing to sync'); return; }
            if (!haveToken) core.warning('FORK_SYNC_TOKEN is not set: forks are compared but not synced');

            const rows = [];
            for (const spec of forks) {
              const m = spec.match(/^([^/\s]+)\/([^:\s]+):(\S+)$/);
              if (!m) throw new Error(`sync_forks entry "${spec}" is not owner/repo:branch`);
              const [, owner, repo, branch] = m;
              const { data: info } = await github.rest.repos.get({ owner, repo });
              if (!info.fork || !info.parent) {
                core.warning(`${owner}/${repo} is not a fork, skipped`);
                rows.push([spec, '', '', 'not a fork']);
                continue;
              }
              const up = { owner: info.parent.owner.login, repo: info.parent.name };
              // merge-upstream syncs from the upstream branch of the same name (its default branch
              // when there is none); compare against the same one, base = fork, head = upstream
              let upBranch = branch;
              try { await github.rest.repos.getBranch({ ...up, branch }); }
              catch (e) { if (e.status !== 404) throw e; upBranch = info.parent.default_branch; }
              const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                ...up, basehead: `${owner}:${repo}:${branch}...${up.owner}:${upBranch}`, per_page: 1 });
              const missing = cmp.ahead_by, own = cmp.behind_by;
              const upstream = `${up.owner}/${up.repo}:${upBranch}`;
              if (!missing) {
                core.info(`${spec} is up to date with ${upstream}`);
                rows.push([spec, upstream, '0', 'up to date']);
                continue;
              }
              if (own) {
                core.warning(`${spec}: ${missing} commit(s) behind ${upstream} but has ${own} commit(s) of its own; not synced, rebase it by hand`);
                rows.push([spec, upstream, String(missing), `not synced: fork has ${own} own commit(s)`]);
                continue;
              }
              if (dryRun || !haveToken) {
                core.info(`${spec}: ${missing} commit(s) behind ${upstream}, would fast-forward`);
                rows.push([spec, upstream, String(missing), 'would fast-forward']);
                continue;
              }
              try {
                const { data: r } = await github.rest.repos.mergeUpstream({ owner, repo, branch });
                core.info(`${spec}: ${r.message}`);
                rows.push([spec, r.base_branch || upstream, String(missing), `synced (${r.merge_type})`]);
              } catch (e) {
                if (e.status === 409) throw new Error(`${spec} conflicts with ${upstream}; sync it by hand`);
                if (e.status === 422) throw new Error(`${spec} could not be synced with ${upstream}: ${e.message}`);
                throw e;
              }
            }
            await core.summary
              .addHeading(`Fork sync${dryRun ? ' (dry run)' : ''}`, 3)
              .addTable([
                ['Fork', 'Upstream', 'Behind by', 'Result'].map((data) => ({ data, header: true })),
                ...rows,
              ])
              .write();

      - name: Bump submodule pins
        if: ${{ !cancelled() }} # a fork-sync failure (conflict, token) must not skip the bump
        uses: actions/github-script@v9
        with:
          script: |
            // dispatch inputs arrive as strings; a cron run has none and uses the defaults
            const inputs = context.payload.inputs ?? {};
            const branches = String(inputs.branches ?? 'resukisu resukisu-nethunter').split(/[\s,]+/).filter(Boolean);
            const dryRun = String(inputs.dry_run ?? false) === 'true';
            const { owner, repo } = context.repo;
            const bot = { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' };
            const short = (sha) => sha.slice(0, 9);

            // .gitmodules text -> [{ name, path, url, branch? }]
            const parseGitmodules = (text) => {
              const subs = [];
              let cur;
              for (const raw of text.split('\n')) {
                const line = raw.trim();
                const head = line.match(/^\[submodule\s+"(.+)"\]$/);
                if (head) { cur = { name: head[1] }; subs.push(cur); continue; }
                const kv = cur && line.match(/^(\w+)\s*=\s*(.+)$/);
                if (kv) cur[kv[1]] = kv[2].trim();
              }
              return subs.filter((s) => s.path && s.url);
            };
            // https://github.com/o/r[.git] or git@github.com:o/r[.git] -> { owner, repo }
            const parseRepo = (url) => {
              const m = url.match(/github\.com[:/]([^/]+)\/([^/]+?)(?:\.git)?\/?$/);
              if (!m) throw new Error(`submodule url is not on github.com: ${url}`);
              return { owner: m[1], repo: m[2] };
            };
            // tip of the submodule's tracked branch, looked up once per repo@branch
            const tips = new Map();
            const tipOf = async (sub) => {
              const r = parseRepo(sub.url);
              const branch = sub.branch || (await github.rest.repos.get(r)).data.default_branch;
              const key = `${r.owner}/${r.repo}@${branch}`;
              if (!tips.has(key)) {
                const { data } = await github.rest.repos.getBranch({ ...r, branch });
                tips.set(key, { ...r, branch, sha: data.commit.sha });
              }
              return tips.get(key);
            };

            const rows = [];
            for (const branch of branches) {
              let headSha;
              try {
                headSha = (await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })).data.object.sha;
              } catch (e) {
                if (e.status !== 404) throw e;
                core.warning(`${branch}: no such branch`);
                rows.push([branch, '', '', '', 'no such branch']);
                continue;
              }

              let subs;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: '.gitmodules', ref: headSha });
                subs = parseGitmodules(Buffer.from(data.content, 'base64').toString());
              } catch (e) {
                if (e.status !== 404) throw e;
                core.info(`${branch}: no .gitmodules, skipped`);
                rows.push([branch, '', '', '', 'no .gitmodules']);
                continue;
              }

              const bumps = [];
              for (const sub of subs) {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: sub.path, ref: headSha });
                if (data.type !== 'submodule') {
                  core.warning(`${branch}: ${sub.path} is a ${data.type}, not a submodule`);
                  continue;
                }
                const tip = await tipOf(sub);
                if (data.sha === tip.sha) {
                  core.info(`${branch}: ${sub.path} already at ${short(tip.sha)} (${tip.branch})`);
                  rows.push([branch, sub.path, short(data.sha), short(tip.sha), 'up to date']);
                  continue;
                }
                bumps.push({ sub, tip, from: data.sha, to: tip.sha });
              }
              if (!bumps.length) continue;

              for (const b of bumps)
                core.info(`${branch}: ${dryRun ? 'would bump' : 'bumping'} ${b.sub.path} ${short(b.from)} -> ${short(b.to)} (${b.tip.branch})`);
              if (dryRun) {
                bumps.forEach((b) => rows.push([branch, b.sub.path, short(b.from), short(b.to), 'would bump']));
                continue;
              }

              const message = `update submodule${bumps.length > 1 ? 's' : ''}\n\n` + bumps
                .map((b) => `${b.sub.path}: ${short(b.from)} -> ${short(b.to)} (${b.tip.branch})\n`
                  + `https://github.com/${b.tip.owner}/${b.tip.repo}/compare/${b.from}...${b.to}`)
                .join('\n\n');
              const baseTree = (await github.rest.git.getCommit({ owner, repo, commit_sha: headSha })).data.tree.sha;
              const tree = (await github.rest.git.createTree({ owner, repo, base_tree: baseTree,
                tree: bumps.map((b) => ({ path: b.sub.path, mode: '160000', type: 'commit', sha: b.to })) })).data;
              const commit = (await github.rest.git.createCommit({ owner, repo, message, tree: tree.sha,
                parents: [headSha], author: bot, committer: bot })).data;
              // plain fast-forward: fails instead of overwriting if someone pushed in the meantime
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.sha, force: false });
              core.info(`${branch}: ${short(headSha)} -> ${short(commit.sha)}`);
              bumps.forEach((b) => rows.push([branch, b.sub.path, short(b.from), short(b.to), `bumped in ${short(commit.sha)}`]));
            }

            await core.summary
              .addHeading(`Submodule bumps${dryRun ? ' (dry run)' : ''}`, 3)
              .addTable([
                ['Branch', 'Submodule', 'Was', 'Tip', 'Result'].map((data) => ({ data, header: true })),
                ...rows,
              ])
              .write();
